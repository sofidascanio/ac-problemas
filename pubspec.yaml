name: ajedrez_app
description: App móvil de práctica y aprendizaje de ajedrez.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  # TODO: fijar versiones concretas tras el primer `flutter pub get`
  # (la API de chessground cambió entre mayores; ver README).
  dartchess: any
  chessground: any
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # assets/data: generado por sincronizar_assets.py
    - assets/data/
    - assets/data/aprender_jugar/conceptos/
    - assets/data/aprender_jugar/fundamentos/basico/
    - assets/data/aprender_jugar/fundamentos/intermedio/
    - assets/data/aprender_jugar/movimientos/
    - assets/data/ejercicios/nivel_1/mate_en_1/
    - assets/data/ejercicios/nivel_1/mate_en_2/
    - assets/data/ejercicios/nivel_2/clavada/
    - assets/data/ejercicios/nivel_2/descubierto/
    - assets/data/ejercicios/nivel_2/doble/
    - assets/data/ejercicios/nivel_2/juegue_y_gane/
    - assets/data/ejercicios/nivel_2/mate_en_2/
    - assets/data/ejercicios/nivel_2/mate_en_3/
    - assets/data/ejercicios/nivel_2/problemas_brillantes/
    - assets/data/ejercicios/nivel_3/finales/
    - assets/data/ejercicios/nivel_3/juegue_y_gane/
    - assets/sounds/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
